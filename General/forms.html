<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>

    <style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f9;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100%;
    }

    .formulario {
      background: #ffffff;
      padding: 30px;
      border-radius: 8px;
      width: 400px;
    }

    .formulario h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #000000;
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid gray;
      border-radius: 5px;
    }

    .opciones {
      margin-top: 10px;
    }

    .opciones label {
      display: inline-flex;
      gap: 10px;
    }

    .terminos{
        margin-top: 20px;
    }

    .terminos label {
      display: inline-flex;
      gap: 10px;
    }

    .terminos input{
        width: 24px;
    }
    
    button {
      width: 100%;
      padding: 12px;
      background-color: rgb(52, 110, 218);
      color: white;
      border: none;
      margin-top: 20px;
      font-size: 16px;
      border-radius: 8px;
    }

    button:hover {
      background-color: rgb(41, 41, 110);
    }

    </style>

</head>

<body>

    <main>

        <form action="" class="formulario">
            <h2>Formulario de Contacto</h2>
            
            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" required placeholder="Ej. Ruby Salazar">

            <label for="email">Correo electronico</label>
            <input type="text" id="email" required placeholder="Ej. example@gmail.com">

            <label for="Telefono">No. Telefono</label>
            <input type="tel" id="Telefono" required placeholder="Ej. 961 123 4567">

            <label for="password">Contraseña</label>
            <input type="password" id="password" required placeholder="Minimo de 8 caracteres">

            <label for="Asunto">Asunto</label>
            <select id="Asunto" required>
                <option value="">Selecciona una opcion</option>
                <option value="Asesoria">Asesoria</option>
                <option value="Cotizacion">Cotizacion</option>
                <option value="Soporte">Atencion al cliente</option>
                <option value="Otros">Otro</option>
            </select>

            <label for="Msj">Mensaje</label>
            <textarea id="Msj" placeholder="Escribe aqui tu mensaje..."></textarea>

            <div class="opciones">
                <p>¿Como prefieres que te contactemos?</p>
                <label for="Correo">
                    <input type="radio" name="contactar" value="Correo">
                    Correo
                </label>

                <br>
                
                <label for="Correo">
                    <input type="radio" name="contactar" value="Telefono">
                    Telefono
                </label>
                
                <br>

                <label for="Correo">
                    <input type="radio" name="contactar" value="WhatsApp">
                    WhatsApp
                </label>
            </div>

            <div class="terminos">
                <label for="TyC">
                    Acepto los terminos y condiciones
                    <input type="checkbox" required>
                </label>
            </div>
            
            <button type="submit">Enviar el mensaje</button>

        </form>

    </main>
    
</body>
</html>
