<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario</title>
</head>
<body>
    <form action="">
        <label for="name">Ingresa tu nombre</label>
        <input type="text" id="name" placeholder="Tu nombre">
        <br>

        <label for="email">Correo electronico:</label>
        <input type="text" id="email" placeholder="Tu email">
        <br>

        <label for="password">Ingresa tu contrasena</label>
        <input type="text" id="password" placeholder="Contrasena">
        <br>

        <label for="telefono">Ingresa tu numero</label>
        <input type="number" id="telefono" placeholder="Tu numero de telefono">
        <br>

        <label for="captcha">No eres un robot?</label>
        <input type="checkbox" id="captcha" placeholder="">
        <br>

        <label for="una_sola">Selecciona</label>
        <input type="radio" id="una_sola" placeholder="">
        <br>

        <label for="subir">Enviar formulario</label>
        <input type="submit" id="subir">
        <br>

        <label for="msj">Mensaje </label>
        <textarea name="" id="" rows="4" cols="40"></textarea>
        <br>

        <input type="checkbox">HTML
        <input type="checkbox">CSS
        <input type="checkbox">C++
        <input type="checkbox">JS
        <br><br>

        <input type="radio">Adenosin trifosfato
        <input type="radio">Adenosin difosfato
        <input type="radio"> Adenosin fosfato
</body>
</html>
